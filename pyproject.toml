[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "montreal_road_risk"
version = "0.1.0"
description = "Predictive Road Pavement Deterioration Risk Assessment and Maintenance Prioritization for Montreal"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "INSE 6311 Project Team" }
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "openpyxl>=3.1.5",
    "geopandas>=1.1.4",
    "shapely>=2.1.2",
    "pyproj>=3.7.2",
    "scikit-learn>=1.9.0",
    "xgboost>=3.2.0",
    "shap>=0.51.0",
    "matplotlib>=3.11.0",
    "seaborn>=0.13.2",
    "folium>=0.20.0",
    "streamlit>=1.59.2",
    "streamlit-folium>=0.27.2",
    "requests>=2.34.2",
    "python-dotenv>=1.2.2",
    "psutil>=5.9.0",
    "joblib>=1.5.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "jupyterlab>=4.6.1",
    "lifelines>=0.30.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "markdown>=3.7.0"
]
test = [
    "pytest>=9.1.1",
    "lifelines>=0.30.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "markdown>=3.7.0"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.ruff]
# Target Python version
target-version = "py311"

# Line length limit
line-length = 100

[tool.ruff.lint]
# Select rules
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort (import sorting)
    "C90",  # mccabe complexity
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
]

ignore = [
    "E501", # Line too long (handled by formatter)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Ignore unused imports and unsorted imports in tests
"tests/*" = ["F401", "I001"]
# Training script: E702 = intentional del;gc.collect() memory management patterns;
# E402 = deferred imports after conditional resource checks
"scripts/phase_5_full_train_xgb_external_memory.py" = ["E702", "E402", "C901"]
